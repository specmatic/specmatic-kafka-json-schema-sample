plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.10'
    id 'jacoco'
}

def snapshotRepoUrl = project.findProperty('snapshotRepoUrl')

repositories {
    mavenLocal()
    maven {
        url "https://packages.confluent.io/maven/"
    }
    mavenCentral()
    if (snapshotRepoUrl) {
        maven {
            url = uri(snapshotRepoUrl)
        }
    }
}

dependencies {
    implementation ('org.springframework.boot:spring-boot-starter')
    implementation ('org.springframework.boot:spring-boot-starter-web')
    implementation ('org.springframework.boot:spring-boot-starter-actuator')
    implementation ('org.springframework.kafka:spring-kafka:3.3.16'){
            exclude group: 'org.lz4', module: 'lz4-java'
        }
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.22.1'

    implementation("io.confluent:kafka-json-schema-serializer:7.9.5")
    implementation("io.confluent:kafka-schema-registry-client:7.9.5")

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation("io.specmatic.enterprise:executable:$specmaticEnterpriseVersion")
    testImplementation("org.testcontainers:testcontainers:1.19.3")
    testImplementation("org.springframework.boot:spring-boot-starter-test")
}

tasks.named('processResources') {
    from('src/main/jsonschema') {
        into 'jsonschema'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        showStackTraces = true
    }
}

configurations.all {
    resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
        select('at.yawk.lz4:lz4-java:1.11.1')
    }
}
